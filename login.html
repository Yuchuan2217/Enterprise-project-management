<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2a4a" />
    <title>登录 · 企业项目管理</title>
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-context" aria-labelledby="contextTitle">
        <div class="context-brand">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>
            <strong>企业项目管理</strong>
            <small>Project Operation Center</small>
          </span>
        </div>

        <div class="context-content">
          <p class="system-state"><i></i>系统运行正常</p>
          <h1 id="contextTitle">让项目、团队与交付保持同一节奏</h1>
          <p class="context-description">
            统一查看项目组合、人员编制和交付风险，让每个决定都有清晰的上下文。
          </p>
        </div>

        <div class="context-stats" aria-label="系统概况">
          <div>
            <strong>24</strong>
            <span>在管项目</span>
          </div>
          <div>
            <strong>68</strong>
            <span>团队成员</span>
          </div>
          <div>
            <strong>86%</strong>
            <span>按期交付</span>
          </div>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="loginTitle">
        <div class="login-form-wrap">
          <div class="login-heading">
            <h2 id="loginTitle">登录后台</h2>
            <p>使用超级管理员账号进入管理控制台。</p>
          </div>

          <form class="login-form" id="loginForm" novalidate>
            <label class="field">
              <span>账号</span>
              <span class="input-shell">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21a8 8 0 0 1 16 0"></path>
                </svg>
                <input
                  id="username"
                  name="username"
                  type="text"
                  value="admin"
                  autocomplete="username"
                  spellcheck="false"
                  maxlength="32"
                  required
                />
              </span>
            </label>

            <label class="field">
              <span>密码</span>
              <span class="input-shell">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect width="18" height="12" x="3" y="10" rx="2"></rect>
                  <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
                </svg>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入密码"
                  maxlength="64"
                  required
                />
                <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="2.5"></circle>
                  </svg>
                </button>
              </span>
            </label>

            <div class="form-options">
              <label class="remember">
                <input id="remember" name="remember" type="checkbox" />
                <span>保持登录状态</span>
              </label>
              <button class="help-button" type="button" id="helpButton">忘记密码</button>
            </div>

            <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>

            <button class="login-button" type="submit">
              <span>进入管理后台</span>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"></path>
              </svg>
            </button>
          </form>

          <div class="demo-account">
            <span>超级管理员演示账号</span>
            <strong>admin</strong>
            <i></i>
            <strong>Aa123456</strong>
          </div>
        </div>

        <p class="login-footer">企业项目管理 · 内部管理平台</p>
      </section>
    </main>

    <script src="./api-client.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
